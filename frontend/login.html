<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · mygit</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand"><span class="brand-mark"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="7" r="2"/><path d="M6 7v10M18 9a6 6 0 0 1-6 6H8"/></svg></span>mygit</div>
    <form class="card card-pad" id="login-form">
      <h1>Sign in</h1>
      <label class="field"><span>Username</span><input type="text" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></label>
      <label class="field"><span>Password</span><input type="password" name="password" autocomplete="current-password" required></label>
      <label class="check"><input type="checkbox" name="remember" checked> Keep me signed in</label>
      <div class="form-error" id="login-error" hidden></div>
      <button class="btn primary" type="submit" style="width:100%">Sign in</button>
    </form>
    <p class="muted small" style="text-align:center;margin-top:16px"><a href="/explore">Browse public repositories</a></p>
  </div>
</div>
<script src="/static/js/core.js"></script>
<script src="/static/js/login.js"></script>
</body>
</html>
