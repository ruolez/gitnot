# Black-box tests against the running stack, from a container on its network:
#   docker compose -f docker-compose.yml -f qa/compose.qa.yml run --rm qa
#   QA_BASE=ubuntu:24.04 QA_TAG=noble docker compose ... run --rm qa
services:
  qa:
    build:
      context: ./qa
      args:
        BASE: ${QA_BASE:-debian:bookworm-slim}
    image: mygit-qa:${QA_TAG:-bookworm}
    env_file: .env
    environment:
      - MYGIT_BASE=http://nginx
      - MYGIT_SSH_HOST=git
      - MYGIT_SSH_PORT=22
    volumes:
      - ./qa:/qa
    profiles: ["qa"]
