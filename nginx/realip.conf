# Mounted only behind the shared host proxy (docker-compose.proxy.yml). The port is bound
# to loopback, so the only peer is that proxy and its X-Real-IP can be trusted. Without
# this every visitor looks like one address and sign-in throttling would lock out everyone.
set_real_ip_from 127.0.0.0/8;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Real-IP;
